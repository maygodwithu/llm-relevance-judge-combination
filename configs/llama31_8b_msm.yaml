# experiment log 139: Llama-3.1-8B-Instruct, LlamaForCausalLM (text only). Target modules: the q/k/v/o projections of the 32 decoder layers (128 modules, 6,815,744 LoRA parameters at r = 8).
model_name: "meta-llama/Llama-3.1-8B-Instruct"

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

optim:
  lr: 2.0e-5
  warmup_ratio: 0.1
  train_batch_size: 2

data:
  max_length: 384

seed: 0
